# Diagnostic : lance une jauge du moniteur système seule (hors bureau) et affiche ses messages.
name: Gadgets du bureau

on:
  workflow_dispatch:

jobs:
  gadget:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Outils
        run: |
          apt-get update
          apt-get install -y --no-install-recommends plasma-workspace plasma-desktop ksystemstats xvfb x11-apps \
            imagemagick python3-pil dbus-x11 fonts-noto-core qml6-module-org-kde-ksysguard 2>&1 | tail -3 || true
          ls /usr/share/plasma/plasmoids | grep -i systemmonitor || true
          ls /usr/share/ksysguard/sensorfaces 2>/dev/null || find / -path /proc -prune -o -name '*piechart*' -print 2>/dev/null | head
      - name: Lancer la jauge
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          export DISPLAY=:99 QT_QPA_PLATFORM=xcb
          eval $(dbus-launch --sh-syntax)
          (ksystemstats > ksystemstats.log 2>&1 &) ; sleep 3
          for p in org.kde.plasma.systemmonitor.cpu org.kde.plasma.systemmonitor; do
            echo "===== $p"
            timeout 25 plasmawindowed $p > $p.log 2>&1 &
            sleep 20
            xwd -root -silent | convert xwd:- $p.png
            grep -v "^$" $p.log | head -40
          done
          echo "===== ksystemstats"; head -20 ksystemstats.log
          python3 - <<'PY'
          import base64, io
          from PIL import Image
          for p in ["org.kde.plasma.systemmonitor.cpu", "org.kde.plasma.systemmonitor"]:
              b = io.BytesIO(); Image.open(p + ".png").convert("RGB").crop((0, 0, 640, 480)).save(b, "JPEG", quality=80)
              d = base64.b64encode(b.getvalue()).decode()
              print("APERCU-DEBUT " + p)
              for i in range(0, len(d), 900): print(d[i:i + 900])
              print("APERCU-FIN")
          PY
