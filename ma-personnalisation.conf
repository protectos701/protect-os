# ═══════════════════════════════════════════════════════════════════════════
#   MA PERSONNALISATION — votre système, à votre façon
# ═══════════════════════════════════════════════════════════════════════════
#
#   Modifiez les valeurs après les signes « = », puis enregistrez.
#   Sur GitHub : ouvrez ce fichier, cliquez sur le crayon ✎, modifiez, puis
#   « Commit changes ». La prochaine construction appliquera vos choix à tout
#   le système : démarrage, bureau, installateur, programmes, site web.
#
#   Une ligne qui commence par # est un commentaire : elle est ignorée.
#   Pour revenir aux choix d'origine, remettez les valeurs indiquées « origine ».
# ═══════════════════════════════════════════════════════════════════════════


[identite]
# Le nom affiché partout (démarrage, connexion, menus, installateur, site).
# origine : protect.OS
nom = protect.OS

# La phrase sous le nom, sur l'installateur et le site.
# origine : Le système qui vous protège
slogan = Le système qui vous protège


[couleurs]
# Deux teintes au format #RRVVBB (choisissez-les sur https://htmlcolorcodes.com/fr/).
#
# « principale » : la teinte des fonds, des fenêtres et du fond d'écran.
#   Les fonds restent sombres ; seule la teinte change (bleu, violet, vert…).
#   origine : #0a1a52 (bleu nuit)
principale = #0a1a52
#
# « accent » : la couleur des boutons, sélections, liserés et du logo.
#   origine : #d4a72c (or)
accent = #d4a72c


[logo]
# Votre logo : un fichier .svg (idéal) ou .png carré (512×512 conseillé).
# Déposez-le dans le dossier « personnalisation » du projet et indiquez son nom.
# Exemple : fichier = personnalisation/mon-logo.png
# Laissez vide pour le bouclier en vitrail, recoloré avec vos couleurs.
fichier =


[fond_ecran]
# Votre image de fond d'écran (.jpg ou .png, idéalement 3840×2160 ou 1920×1080).
# Elle sert aussi pour l'écran de connexion, le verrouillage et le menu de démarrage.
# Exemple : fichier = personnalisation/mon-fond.jpg
# Laissez vide pour le vitrail généré automatiquement avec vos couleurs.
fichier =



[bureau]
# Thème : sombre ou clair                                   origine : sombre
theme = sombre

# Barre des tâches : centree (menu et icônes au milieu) ou gauche   origine : centree
barre = centree

# Position de la barre : bas ou haut                        origine : bas
position = bas

# Effet verre (menus, terminal et fenêtres en arrière-plan translucides) : oui ou non
# origine : oui
verre = oui

# Ouvrir l'assistant « Bienvenue » à la première connexion : oui ou non   origine : oui
assistant = oui


[noms_applications]
# Le nom de chaque application dans le menu Démarrer : choisissez les vôtres !
# Laissez vide pour garder le nom d'origine du logiciel (Dolphin, Konsole, Spectacle…).
explorateur = Explorateur de fichiers
terminal = Terminal
capture = Capture d'écran
gestionnaire_taches = Gestionnaire des tâches
pdf = Lecteur PDF
photos = Photos
editeur = Bloc-notes
calculatrice = Calculatrice
magasin = Magasin d'applications
parametres = Paramètres
archives = Archives
disques = Gestionnaire de disques


[raccourcis]
# Vos raccourcis clavier. « Meta » est la touche ⊞ (Windows). Laissez vide pour aucun raccourci.
# Déjà inclus d'office : Meta+L verrouiller, Meta+D afficher le bureau, Meta+V presse-papiers,
#   Impr écran capture d'écran, Alt+Tab changer de fenêtre, Meta+flèches ranger une fenêtre.
explorateur = Meta+E
gestionnaire_taches = Ctrl+Shift+Esc
parametres = Meta+I
terminal = Ctrl+Alt+T
capture_zone = Meta+Shift+S
executer = Meta+R
centre_protection = Meta+Shift+P


[protection]
# Bloquer les publicités et les traqueurs dans tout le système : oui ou non   origine : oui
bloqueur_pubs = oui

# Firefox plus confidentiel (anti-pistage strict, pas de télémétrie, uBlock Origin) : oui ou non
# origine : oui
firefox_confidentiel = oui


[logiciels]
# Logiciels à AJOUTER, séparés par des virgules ou des espaces (paquets Debian,
# à vérifier sur https://packages.debian.org). Exemples :
#   gimp, inkscape, krita, kdenlive, obs-studio, audacity, thunderbird,
#   steam-installer, blender, freecad, musescore3, stellarium, kstars
ajouter =

# Logiciels à RETIRER parmi ceux inclus d'origine. Exemples :
#   libreoffice-impress, vlc, kate, partitionmanager, hplip, skanlite
retirer =

# Applications épinglées dans la barre des tâches, dans l'ordre, séparées par des virgules.
# Noms reconnus : explorateur, firefox, terminal, writer, calc, impress, discover,
#   parametres, protection, programmes, vlc, gimp, thunderbird, steam, kate,
#   calculatrice, photos, pdf
# (ou le nom exact d'un fichier .desktop, par exemple org.kde.krita.desktop)
# origine : explorateur, firefox, terminal, writer, discover, parametres
epingles = explorateur, firefox, terminal, writer, discover, parametres


[langue]
# Langue du système : fr_FR.UTF-8, fr_BE.UTF-8, fr_CH.UTF-8, fr_CA.UTF-8,
#   en_US.UTF-8, en_GB.UTF-8, de_DE.UTF-8, es_ES.UTF-8, it_IT.UTF-8, pt_PT.UTF-8, nl_NL.UTF-8
# (Les programmes propres au système — Centre de protection, Installateur… —
#  restent en français pour l'instant.)
# origine : fr_FR.UTF-8
langue = fr_FR.UTF-8

# Clavier : fr (AZERTY France), be (AZERTY Belgique), ch (Suisse), ca (Canada),
#   us (QWERTY), gb (Royaume-Uni), de (QWERTZ), es, it, pt
# origine : fr
clavier = fr

# Variante du clavier (souvent vide). Exemple pour la Suisse romande : clavier = ch et variante = fr
variante =

# Fuseau horaire : Europe/Paris, Europe/Brussels, Europe/Zurich, America/Montreal,
#   Africa/Abidjan, Africa/Casablanca, Indian/Reunion, America/Martinique…
# origine : Europe/Paris
fuseau = Europe/Paris
