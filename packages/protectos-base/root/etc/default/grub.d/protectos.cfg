# Réglages GRUB de protect.OS (appliqués au système installé)
GRUB_DISTRIBUTOR="protect.OS"
# Démarrage silencieux : aucun texte technique, seulement l'écran protect.OS
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0"
# Menu caché comme sur Windows : maintenez Échap au démarrage pour l'afficher
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
GRUB_DISABLE_RECOVERY=true
GRUB_BACKGROUND="/usr/share/wallpapers/ProtectOS/contents/images/1920x1080.png"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="yellow/blue"
