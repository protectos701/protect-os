# protect.OS : la base antivirus se met à jour quand Internet est là.
# Sans connexion (session d'essai, premier démarrage), ce n'est pas une panne :
# la mise à jour sera refaite plus tard, sans message « FAILED » au démarrage.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
SuccessExitStatus=1 2 52 54 55 56 57 58 59 60 61 62
